name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format (cargo fmt --check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory until the existing formatting debt is cleared.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (cargo clippy -- -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Advisory until the existing clippy warnings are cleared.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check all targets
        run: cargo check --workspace --all-features --all-targets --locked

      - name: Unit tests
        run: cargo test --workspace --all-features --lib --locked

      # Live messaging/director tests are #[ignore]d. Run them explicitly with:
      #   cargo test --workspace --all-features --locked -- --ignored
      - name: All tests (integration tests gated by #[ignore])
        run: cargo test --workspace --all-features --locked --no-fail-fast

  deny:
    name: Dependencies (cargo deny check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory: the dependency tree currently has known advisories and a license
    # outside deny.toml's allow-list. Upgrade/allow decisions are tracked separately.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked
